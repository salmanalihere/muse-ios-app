
workflows:
  foldfleet-ios:
    name: Foldfleet iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.foldfleet.game
      xcode: 27.1

    scripts:
      - name: Check Xcode version
        script: |
          xcodebuild -version

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/Foldfleet.xcodeproj" \
            --scheme "Foldfleet"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
